  Patches 01-10 are direct commits; use git format-patch or git show to extract.
  Patches 11-12 are manually extracted from d7b74a13a374 (skip 11a/11b, already in tree).
  
  Key API differences from vgpu-linux baseline:
  - mm.buddy() returns Result<&GpuBuddy> (buddy is Option)
